*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0a0a09;color:#e2ddd5;font-family:'Jost',sans-serif}
body{display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:100%;max-width:320px;text-align:center}

.sub{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#5a5750;margin-top:4px}
form{margin-top:26px;display:flex;flex-direction:column;gap:8px}

input:focus{outline:none;border-color:#c9a96e}
button{background:none;border:1px solid rgba(255,255,255,.12);color:#e2ddd5;font-family:inherit;
  font-size:13px;letter-spacing:.06em;padding:11px;border-radius:2px;cursor:pointer}
button:hover{border-color:#c9a96e;color:#c9a96e}
.msg{margin-top:12px;font-size:12px;color:#c0392b;min-height:16px}
.msg.wait{color:#5a5750}
</style>

var m = document.getElementById('m');
function b64(s){var r=atob(s),a=new Uint8Array(r.length);for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a;}
function open_(pw){
  m.className='msg wait';m.textContent='Расшифровываю…';
  return crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey'])
    .then(function(base){
      return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.s),iterations:P.n,hash:'SHA-256'},
        base,{name:'AES-GCM',length:256},false,['decrypt']);})
    .then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.i)},k,b64(P.d));})
    .then(function(buf){
      try{sessionStorage.setItem('visa-es-pw',pw);}catch(e){}
      var html=new TextDecoder().decode(buf);
      document.open();document.write(html);document.close();
    })
    .catch(function(){m.className='msg';m.textContent='Пароль не подошёл';});
}
document.getElementById('f').addEventListener('submit',function(e){
  e.preventDefault();var v=document.getElementById('p').value;if(v)open_(v);});
try{var saved=sessionStorage.getItem('visa-es-pw');if(saved)open_(saved);}catch(e){}
