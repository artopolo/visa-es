button:hover{border-color:#17171a;background:rgba(255,255,255,.5)}
.msg{margin-top:12px;font-size:12px;color:#c23a2b;min-height:16px}
.uhide{position:absolute;left:-9999px;top:0;width:1px;height:1px;opacity:0;padding:0;border:0}
.msg.wait{color:#8d8d95}

var m = document.getElementById('m');
var KEY = 'visa-es-pw';
function b64(s){var r=atob(s),a=new Uint8Array(r.length);for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a;}
function ss(k,v){try{return v===undefined?sessionStorage.getItem(k):sessionStorage.setItem(k,v);}catch(e){return null;}}
function open_(pw){
  m.className='msg wait';m.textContent='Расшифровываю…';
  return crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey'])
    .then(function(base){
      return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.s),iterations:P.n,hash:'SHA-256'},
        base,{name:'AES-GCM',length:256},false,['decrypt']);})
    .then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.i)},k,b64(P.d));})
    .then(function(buf){
      ss(KEY,pw);
      var html=new TextDecoder().decode(buf);
      document.open();document.write(html);document.close();
    })
    .catch(function(){
      try{sessionStorage.removeItem(KEY);}catch(e){}
      m.className='msg';m.textContent='Пароль не подошёл';
      var p=document.getElementById('p');if(p){p.value='';p.focus();}
    });
}
/* Пароль кладётся в сессию, форма уходит обычной отправкой — по этой навигации
   Safari и предлагает сохранить пароль в связку ключей. Поля без name,
   поэтому в адрес ничего не попадает. */
document.getElementById('f').addEventListener('submit',function(){
  var v=document.getElementById('p').value;
  if(!v)return;
  ss(KEY,v);
});
var saved=ss(KEY);
if(saved)open_(saved);
</script>
